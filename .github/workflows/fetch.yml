name: fetch
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: fetch, cancel-in-progress: false}
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sf -m 20 -X POST -H 'Content-Type: application/json' -H 'User-Agent: Mozilla/5.0' -H 'clienttype: web' \
            -d '{"pageNumber":1,"pageSize":50,"portfolioId":"5075281354358777856"}' \
            https://www.binance.com/bapi/futures/v1/friendly/future/copy-trade/lead-portfolio/trade-history \
            | jq -c '{at:(now|floor),total:.data.total,list:.data.list}' > trades.json.new
          jq -e '.list|length>0' trades.json.new >/dev/null
          old=$(jq -c .list trades.json 2>/dev/null || echo); new=$(jq -c .list trades.json.new)
          if [ "$old" != "$new" ]; then mv trades.json.new trades.json
            git config user.name bot; git config user.email bot@users.noreply.github.com
            git add trades.json; git commit -qm "trades $(date -u +%FT%TZ)"; git push -q; fi
